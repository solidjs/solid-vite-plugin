
name: ci

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]

jobs:
  e2e-tests:
    name: "E2E tests"
    strategy:
      fail-fast: false

    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Install project dependencies
        run: pnpm i

      - name: Build project
        run: pnpm run build

      - name: Type-check examples
        run: pnpm run typecheck:examples

      - name: Dev manifest startup test
        working-directory: examples/css-matrix
        run: node test/startup.mjs

      - name: Test isolated dev manifest cache
        working-directory: examples/css-matrix
        run: node test/bridge.mjs && node test/cache.mjs

      - name: Run tests
        run: pnpm run test
